name: Visual Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run manually to regenerate baselines (e.g. after intentional UI changes)
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual baselines and commit them back'
        type: boolean
        default: false

jobs:
  visual-tests:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history + write access to commit updated baselines
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # ── Normal mode: compare against committed baselines ──────────────────
      - name: Run visual tests
        if: ${{ !inputs.update_snapshots }}
        run: pnpm run test:visual

      # ── Update mode: regenerate all baselines and upload as artifact ────────
      - name: Update visual baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm run test:visual:update || true
        # "|| true" because --update-snapshots exits with code 1 on first run
        # when snapshots don't exist yet (it writes them but still reports failure)

      - name: Upload updated baselines as artifact
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual.spec.ts-snapshots/
          retention-days: 7

      # ── Always: upload diffs on failure for inspection ────────────────────
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: test-results/
          retention-days: 7
